manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # This repo is also consumed as a Zephyr module (see zephyr/module.yml) so
    # that boards/shields/eyelash_sofle is on the board root. It must point at
    # THIS fork -- pointing it at the vendor repo means shield edits made here
    # are ignored at build time. Switch the revision to `main` once this branch
    # is merged.
    - name: eyelash_sofle
      url: https://github.com/afmotta/zmk-sofle
      revision: claude/zmk-fork-alignment-docs-3c9og6
    # Stock upstream ZMK, pinned rather than floating on `main`. Bump this
    # deliberately; the `.github/workflows/build.yml` ref must be kept on a
    # matching Zephyr generation.
    - name: zmk
      remote: zmkfirmware
      revision: aed236f53fc2e6377293b3c6bd4a2eb3d97dc763
      import: app/west.yml
  self:
    path: config
